# identuum-ui — manual image publish workflow.
#
# ★ MANUAL ONLY. workflow_dispatch — never runs on push or PR. ★
#
# Builds the UI container image from the repo-root `Dockerfile` (Node 22
# + Next.js standalone, port 7104, healthcheck), vuln-scans it (Trivy,
# fail on HIGH/CRITICAL, BEFORE any registry login), and pushes it to
# ghcr.io/identuum/identuum-ui with a user-specified version tag and a
# short-SHA tag. An opt-in `latest_tag` input also pushes :latest; that
# input defaults to `false` so an accidental run NEVER moves the rolling
# `latest` pointer.
#
# Identuum IDP OSS customer install (see
# wiki/platform/idp-appliance-install-ux.md D-IDP-INSTALL-06) downloads
# `identuum-idp-oss/deployment/docker-compose.yml`, which pulls the UI
# image by version tag pinned at its published digest (v0.2.0 at this
# writing). This workflow publishes the image that customer flow expects.
#
# Permissions:
#   contents: read   — checkout
#   packages: write  — push to ghcr.io with the workflow's
#                      ${{ secrets.GITHUB_TOKEN }} (no PAT, no static
#                      secret, no third-party credential).
#
# No secrets are added by this workflow. No registry credentials are
# stored in the repository.

name: Publish UI image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to publish (e.g. v0.1.0). Pushed alongside the short-SHA tag.'
        required: true
        type: string
      latest_tag:
        description: 'Also push :latest. Defaults to false; never set true on an accidental run.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image metadata
        id: meta
        run: |
          # Short SHA tag is always pushed alongside the version tag so
          # operators can pin to an immutable revision.
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/identuum-ui"
          VERSION_TAG="${{ inputs.version_tag }}"

          TAGS="${REGISTRY_IMAGE}:${VERSION_TAG}"
          TAGS="${TAGS},${REGISTRY_IMAGE}:sha-${SHORT_SHA}"
          if [ "${{ inputs.latest_tag }}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY_IMAGE}:latest"
          fi

          {
            echo "registry_image=${REGISTRY_IMAGE}"
            echo "version_tag=${VERSION_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        # Required so the linux/arm64 stage can cross-compile on the
        # linux/amd64 GitHub-hosted runner. `node:22-bookworm-slim` is
        # multi-arch upstream so no Dockerfile changes are required.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # ── Vulnerability gate — BEFORE login/push ─────────────────────────────
      # Mirrors the identuum-idp-oss publish workflow's Trivy step (same action
      # pin, same flags): the image is built locally (single-arch, loaded into
      # the daemon) and scanned; a HIGH/CRITICAL finding fails the run before
      # any registry credential is even acquired. Added after v0.2.0, which
      # published GATE-LESS but passed this exact gate shape in a local scan at
      # the release commit (trivy --severity HIGH,CRITICAL --ignore-unfixed
      # --exit-code 1: exit 0). The v0.3.4 IdP release was stopped by this very
      # gate shape; the UI workflow had no equivalent until now.
      - name: Build for scan (linux/amd64, local only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: identuum-ui:verify
          platforms: linux/amd64

      - name: Vulnerability scan (Trivy) — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: identuum-ui:verify
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build context is the repo root; the production Dockerfile is
          # the one the local compose stack and the customer-facing
          # deployment already reference.
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Multi-arch manifest. Apple Silicon hosts pull the linux/arm64
          # variant natively; linux/amd64 covers the GitHub-hosted runner
          # and most server deployments.
          platforms: linux/amd64,linux/arm64
          provenance: false
