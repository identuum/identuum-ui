# identuum-ui CI pipeline.
# Runs on every push and pull request to main / master.
#
# This workflow mirrors the repo-local `make verify` target verbatim:
#
#   pnpm exec biome check . --reporter=json --max-diagnostics=none
#   pnpm exec tsc --noEmit
#   pnpm exec vitest run
#
# Scope intent. The first identuum-ui CI workflow is deliberately
# narrow: no Playwright, no `next build`, no live IDP/AG runtime, no
# Docker, no secrets. Authenticated specs (login, MFA, sessions,
# admin UI, setup/upgrade wizards) require `.env.playwright.idp-oss.local`
# credentials which are NOT present in CI. The OSS scaffold spec
# (`e2e/oss-contract.spec.ts`) is safe without credentials but it
# requires a live identuum-idp-oss container — out of scope for a
# Node-only validation workflow. A future slice can add a separate
# job that brings up the OSS scaffold and runs the contract spec.
#
# Permissions are least-privilege; the workflow reads the repo and
# reports check status. No GITHUB_TOKEN-elevated steps, no PAT, no
# deploy key. No GHCR login, no image publish, no workflow_dispatch.
# The publish-image.yml workflow (workflow_dispatch only) is NOT
# affected by this file.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # THE-SECOND-INSTALL: the ONE declared rulefloor version for the WHOLE
  # workflow — any job that installs rulefloor derives URL tag, tarball
  # directory, ldflags stamp, and version assert from this pair. Bump
  # both lines together.
  RULEFLOOR_VERSION: v0.9.0
  RULEFLOOR_SHA256: 525803b58c2881415da532555b927bc8e75a15d4c5a7c813836bfde17a517d36
  # THE-UNWATCHED-FOUR: one declaration per tool, every use derived,
  # every version printed and asserted. GO_VERSION drives setup-go for
  # the ledger-tool build; the vendored install gate's digest must match
  # the shared master (the wiki-side check holds all three copies and
  # this pin identical).
  GO_VERSION: "1.27.1"
  RULEFLOOR_GATE_SHA256: "db2a505d1c1f2fb55b34632a5098ef658dd6fbab1671e58de2c41788a63f37a6"
  # THE-UNWITNESSED-MIRROR: same contract for the gate witness — the vendored
  # scripts/gate-witness.sh must be the wiki master, or the record CI uploads
  # is written by something else. Held identical to the wiki-side digest
  # (contracts/gate-witness.master.sha256) by gate-witness.sh --sync-check.
  GATE_WITNESS_SHA256: "1377b103674b75f97d171fa41fed1651863ca9c0244ee51972b125c266d9ed5e"

jobs:
  build-and-test:
    name: Build & Unit Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # THE-UNBOUND-STAMP (2026-08-27): node has TWO truths and CI now
      # tests BOTH. 22 is the DEPLOYED runtime — the Dockerfile's three
      # stages run node:22-bookworm-slim, and @types/node is held at 22
      # by the recorded dependency-currency note — so the engines floor
      # ">=22.15.0" stays and is finally exercised instead of asserted.
      # 24 is the local dev runtime that green-lights closes. The
      # previous single pin (22, then 24) always left one of the two
      # untested; the floor moves only when the image base and
      # @types/node move with it, together.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the install gate is the shared master
        # THE-UNWATCHED-FOUR: a weakened vendored copy would pass CI with
        # a gate that no longer gates.
        run: echo "${RULEFLOOR_GATE_SHA256}  scripts/rulefloor-install-gate.sh" | sha256sum -c -

      - name: Verify the gate witness is the shared master
        # THE-UNWITNESSED-MIRROR: the asymmetry closed — the install gate was
        # digest-checked here but the witness that writes this job's uploaded
        # record was not. Runs BEFORE the record opens: the two digest steps
        # gate the scripts everything after them trusts, so they sit outside
        # the record and the record's cites line says so.
        run: echo "${GATE_WITNESS_SHA256}  scripts/gate-witness.sh" | sha256sum -c -

      - name: Open the gate run record
        # THE-UNWITNESSED-MIRROR: this job has no single entry point — it is
        # discrete steps interleaved with setup actions a wrapper cannot run —
        # so the record is written STEP-BY-STEP: this init declares the plan
        # ONCE, every shell step below routes through `step`, and finalize
        # refuses green unless every planned step recorded exit=0. This plan
        # is the single declared CI step set for this repo.
        env:
          GATE_WITNESS_CITES: "the 'Open the gate run record' step of build-and-test in .github/workflows/ci.yml is the single declared CI step set; the two script-digest steps run before this record opens and sit outside it; checkout/setup-node/setup-go are actions the witness cannot run"
        run: bash scripts/gate-witness.sh init GATE-RUN.ci.txt "identuum-ui CI build-and-test (node ${{ matrix.node }})" rulefloor-route-scan corepack-enable prove-node pnpm-install biome tsc vitest prove-go rulefloor-gate

      - name: Reject undeclared rulefloor install routes
        # Vendored at scripts/rulefloor-install-gate.sh because this
        # single-repo CI checkout has no ../wiki sibling. Scanning the full
        # workflow directory makes a second install route fail before tools run.
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'rulefloor-route-scan=bash scripts/rulefloor-install-gate.sh .github/workflows'

      # Activate pnpm via corepack BEFORE setup-node so the
      # `cache: pnpm` option in setup-node finds the binary.
      - name: Enable corepack (pnpm)
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'corepack-enable=corepack enable'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Use pnpm's content-addressed store for cross-run reuse.
          # Cache key is auto-derived from pnpm-lock.yaml.
          cache: pnpm

      - name: Prove the node version
        # THE-UNWATCHED-FOUR: print and assert the runtime actually
        # resolved for this matrix leg.
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'prove-node=node --version && node --version | grep -E "^v${{ matrix.node }}\."'

      - name: Install dependencies (frozen lockfile)
        # --frozen-lockfile fails the run if pnpm-lock.yaml is out of
        # date with package.json; this catches accidental hand edits.
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'pnpm-install=pnpm install --frozen-lockfile'

      - name: Biome check (lint + format)
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'biome=pnpm exec biome check . --reporter=json --max-diagnostics=none'

      - name: TypeScript typecheck (tsc --noEmit)
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'tsc=pnpm exec tsc --noEmit'

      - name: Unit tests (vitest run)
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'vitest=pnpm exec vitest run'

      # THE-TOOLING-UPGRADE: CI runs the REAL rulefloor check through the
      # same scripts/rulefloor-gate.sh developers run — hashes,
      # extractor-owned discovery, orphan scan. The homegrown
      # scripts/rulefloor-static.mjs subset is DELETED: it reimplemented
      # extraction with pre-v0.3.0 semantics and never verified hashes.
      # The Go toolchain here exists solely to BUILD the pinned ledger
      # tool from its release tarball.
      - name: Set up Go (for the ledger tool)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Derived from the ONE workflow-env declaration
          # (THE-UNWATCHED-FOUR) — previously a hardcoded literal here.
          go-version: ${{ env.GO_VERSION }}
          # No go.mod in this repo — the default dependency cache has
          # nothing to key on and only emits a "Restore cache failed"
          # warning (measured, run 32577553874). This Go exists solely
          # to build the pinned ledger tool.
          cache: false

      - name: Prove the Go toolchain version
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt 'prove-go=go version && go version | grep -F "go${GO_VERSION} "'
      - name: Rule ledger check (rulefloor, brew-identical build)
        # THE-SAME-BINARY (2026-08-27): CI builds rulefloor from the SAME
        # immutable source artifact local brew builds — tag tarball +
        # sha256 lifted from the tap formula — with brew's exact ldflags
        # version stamp. `go install` is banned: module-proxy artifact
        # chain, no version stamp (self-reports "dev"). The printed
        # version must match the pin — a version nobody prints is a
        # version nobody can check.
        # THE-UNBOUND-STAMP/THE-SECOND-INSTALL: RULEFLOOR_VERSION is
        # declared ONCE, at the WORKFLOW env — URL tag, tarball directory,
        # ldflags stamp, and the assert all derive from it, mirroring
        # brew's v#{version}-from-url. A bump edits exactly two lines
        # (version + sha); no pair can diverge silently.
        # The multi-line body moves into STEP_CMD so the witness records this
        # step without re-quoting it: `step` splits name=command at the FIRST
        # `=`, so the = signs inside are safe.
        env:
          STEP_CMD: |
            curl -sSfL -o rulefloor.tar.gz "https://github.com/ozgurcd/rulefloor/archive/refs/tags/${RULEFLOOR_VERSION}.tar.gz"
            echo "${RULEFLOOR_SHA256}  rulefloor.tar.gz" | sha256sum -c -
            tar -xzf rulefloor.tar.gz
            (cd "rulefloor-${RULEFLOOR_VERSION#v}" && go build -ldflags "-X main.version=${RULEFLOOR_VERSION}" -o "$(go env GOPATH)/bin/rulefloor" .)
            rm -rf rulefloor.tar.gz "rulefloor-${RULEFLOOR_VERSION#v}"
            "$(go env GOPATH)/bin/rulefloor" version --json
            "$(go env GOPATH)/bin/rulefloor" version --json | grep -F "\"version\":\"${RULEFLOOR_VERSION}\""
            RULEFLOOR_BIN="$(go env GOPATH)/bin/rulefloor" bash scripts/rulefloor-gate.sh
        run: bash scripts/gate-witness.sh step GATE-RUN.ci.txt "rulefloor-gate=$STEP_CMD"

      - name: Finalize the gate run record
        # if: always() — a red run must still close its record so the artifact
        # reads INCOMPLETE/red, never silently green. GATE_WITNESS_TIE=commit:
        # this checkout cannot commit its record, so the witness ties it to
        # the commit SHA the job executed against instead of the local content
        # digest (the record itself says why). The tarball build above cleans
        # up after itself, so the tree is still exactly the checkout commit
        # when the tie is stamped.
        if: always()
        env:
          GATE_WITNESS_TIE: commit
        run: |
          if [ -f GATE-RUN.ci.txt ]; then
            bash scripts/gate-witness.sh finalize GATE-RUN.ci.txt
          else
            echo "no record to finalize (job died before init)"
          fi

      - name: Upload the gate run record
        # if-no-files-found stays warn: when the job dies before init there is
        # no record, and this step must not repaint that failure as its own.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-run-ci-node${{ matrix.node }}
          path: GATE-RUN.ci.txt
          if-no-files-found: warn
