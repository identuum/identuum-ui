# identuum-ui CI pipeline.
# Runs on every push and pull request to main / master.
#
# This workflow mirrors the repo-local `make verify` target verbatim:
#
#   pnpm exec biome check . --reporter=json --max-diagnostics=none
#   pnpm exec tsc --noEmit
#   pnpm exec vitest run
#
# Scope intent. The first identuum-ui CI workflow is deliberately
# narrow: no Playwright, no `next build`, no live IDP/AG runtime, no
# Docker, no secrets. Authenticated specs (login, MFA, sessions,
# admin UI, setup/upgrade wizards) require `.env.playwright.idp-oss.local`
# credentials which are NOT present in CI. The OSS scaffold spec
# (`e2e/oss-contract.spec.ts`) is safe without credentials but it
# requires a live identuum-idp-oss container — out of scope for a
# Node-only validation workflow. A future slice can add a separate
# job that brings up the OSS scaffold and runs the contract spec.
#
# Permissions are least-privilege; the workflow reads the repo and
# reports check status. No GITHUB_TOKEN-elevated steps, no PAT, no
# deploy key. No GHCR login, no image publish, no workflow_dispatch.
# The publish-image.yml workflow (workflow_dispatch only) is NOT
# affected by this file.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # THE-SECOND-INSTALL: the ONE declared rulefloor version for the WHOLE
  # workflow — any job that installs rulefloor derives URL tag, tarball
  # directory, ldflags stamp, and version assert from this pair. Bump
  # both lines together.
  RULEFLOOR_VERSION: v0.7.0
  RULEFLOOR_SHA256: a0b6ef8a212c64378a8aae9785bd8a589efa71daa42af3ce792827c70c4dc6c6

jobs:
  build-and-test:
    name: Build & Unit Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # THE-UNBOUND-STAMP (2026-08-27): node has TWO truths and CI now
      # tests BOTH. 22 is the DEPLOYED runtime — the Dockerfile's three
      # stages run node:22-bookworm-slim, and @types/node is held at 22
      # by the recorded dependency-currency note — so the engines floor
      # ">=22.15.0" stays and is finally exercised instead of asserted.
      # 24 is the local dev runtime that green-lights closes. The
      # previous single pin (22, then 24) always left one of the two
      # untested; the floor moves only when the image base and
      # @types/node move with it, together.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject undeclared rulefloor install routes
        # Vendored at scripts/rulefloor-install-gate.sh because this
        # single-repo CI checkout has no ../wiki sibling. Scanning the full
        # workflow directory makes a second install route fail before tools run.
        run: bash scripts/rulefloor-install-gate.sh .github/workflows

      # Activate pnpm via corepack BEFORE setup-node so the
      # `cache: pnpm` option in setup-node finds the binary.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Use pnpm's content-addressed store for cross-run reuse.
          # Cache key is auto-derived from pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        # --frozen-lockfile fails the run if pnpm-lock.yaml is out of
        # date with package.json; this catches accidental hand edits.
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm exec biome check . --reporter=json --max-diagnostics=none

      - name: TypeScript typecheck (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Unit tests (vitest run)
        run: pnpm exec vitest run

      # THE-TOOLING-UPGRADE: CI runs the REAL rulefloor check through the
      # same scripts/rulefloor-gate.sh developers run — hashes,
      # extractor-owned discovery, orphan scan. The homegrown
      # scripts/rulefloor-static.mjs subset is DELETED: it reimplemented
      # extraction with pre-v0.3.0 semantics and never verified hashes.
      # The Go toolchain here exists solely to BUILD the pinned ledger
      # tool from its release tarball.
      - name: Set up Go (for the ledger tool)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to the toolchain the sibling repo's go.mod resolves
          # (THE-SAME-BINARY) — `stable` was a rolling pin.
          go-version: '1.27.0'
          # No go.mod in this repo — the default dependency cache has
          # nothing to key on and only emits a "Restore cache failed"
          # warning (measured, run 32577553874). This Go exists solely
          # to build the pinned ledger tool.
          cache: false
      - name: Rule ledger check (rulefloor, brew-identical build)
        # THE-SAME-BINARY (2026-08-27): CI builds rulefloor from the SAME
        # immutable source artifact local brew builds — tag tarball +
        # sha256 lifted from the tap formula — with brew's exact ldflags
        # version stamp. `go install` is banned: module-proxy artifact
        # chain, no version stamp (self-reports "dev"). The printed
        # version must match the pin — a version nobody prints is a
        # version nobody can check.
        # THE-UNBOUND-STAMP/THE-SECOND-INSTALL: RULEFLOOR_VERSION is
        # declared ONCE, at the WORKFLOW env — URL tag, tarball directory,
        # ldflags stamp, and the assert all derive from it, mirroring
        # brew's v#{version}-from-url. A bump edits exactly two lines
        # (version + sha); no pair can diverge silently.
        run: |
          curl -sSfL -o rulefloor.tar.gz "https://github.com/ozgurcd/rulefloor/archive/refs/tags/${RULEFLOOR_VERSION}.tar.gz"
          echo "${RULEFLOOR_SHA256}  rulefloor.tar.gz" | sha256sum -c -
          tar -xzf rulefloor.tar.gz
          (cd "rulefloor-${RULEFLOOR_VERSION#v}" && go build -ldflags "-X main.version=${RULEFLOOR_VERSION}" -o "$(go env GOPATH)/bin/rulefloor" .)
          rm -rf rulefloor.tar.gz "rulefloor-${RULEFLOOR_VERSION#v}"
          "$(go env GOPATH)/bin/rulefloor" version --json
          "$(go env GOPATH)/bin/rulefloor" version --json | grep -F "\"version\":\"${RULEFLOOR_VERSION}\""
          RULEFLOOR_BIN="$(go env GOPATH)/bin/rulefloor" bash scripts/rulefloor-gate.sh
